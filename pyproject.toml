[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "akilan"
version = "0.1.0"
description = "Geometry-aware, AI-friendly PDF artifact construction using native PyMuPDF signals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akilan" }]
dependencies = ["pymupdf>=1.26.0,<2"]
keywords = [
  "pdf",
  "pymupdf",
  "document-ai",
  "layout-analysis",
  "document-processing",
  "rag",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Text Processing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "ruff>=0.12",
]

[project.scripts]
akilan = "akilan.cli:main"
akilan-corpus = "akilan.corpus_cli:main"
akilan-compare-benchmarks = "akilan.benchmark_comparison_cli:main"
akilan-preflight = "akilan.pdf_preflight_cli:main"
akilan-preflight-batch = "akilan.pdf_preflight_batch_cli:main"
akilan-benchmark-preflight = "akilan.benchmark_preflight_cli:main"
akilan-guarded-benchmark = "akilan.guarded_benchmark_cli:main"
akilan-schema-compatibility = "akilan.schema_compatibility_cli:main"
akilan-artifact-intake = "akilan.artifact_intake_cli:main"
akilan-artifact-intake-batch = "akilan.artifact_intake_batch_cli:main"
akilan-artifact-integrity = "akilan.artifact_directory_integrity_cli:main"

[project.urls]
Homepage = "https://github.com/Akilankm/akilan"
Repository = "https://github.com/Akilankm/akilan"
Issues = "https://github.com/Akilankm/akilan/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/akilan"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["akilan"]
warn_unused_ignores = false
